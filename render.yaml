services:
  - type: web
    name: group-up-hero-roulette
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/client
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
